# This site is its own pnpm workspace root (stops pnpm/Next walking up to parent folders).
packages:
  - "."

# The TotalWeb modules reference each other with workspace:* inside their monorepo;
# point those at the same file: copies here.
overrides:
  "@totalweb/crm": "file:./vendor/totalweb/crm"
  "@totalweb/social": "file:./vendor/totalweb/social"
  "@totalweb/supabase": "file:./vendor/totalweb/supabase"
  "@totalweb/ui": "file:./vendor/totalweb/ui"

allowBuilds:
  esbuild: true
  sharp: true
  "@tailwindcss/oxide": true
  unrs-resolver: true
