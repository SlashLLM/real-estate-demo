# This site is its own pnpm workspace root (stops pnpm/Next walking up to parent folders).
packages:
  - "."

# The TotalWeb modules reference each other with workspace:* inside their monorepo;
# point those at the same file: copies here.
overrides:
  "@totalweb/crm": "file:C:/SlashLLM/TotalWeb/packages/crm"
  "@totalweb/social": "file:C:/SlashLLM/TotalWeb/packages/social"
  "@totalweb/supabase": "file:C:/SlashLLM/TotalWeb/packages/supabase"
  "@totalweb/ui": "file:C:/SlashLLM/TotalWeb/packages/ui"

allowBuilds:
  esbuild: true
  sharp: true
  "@tailwindcss/oxide": true
  unrs-resolver: true
